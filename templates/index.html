<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090909">
  <title>Password Security | BCA Project</title>
  
  <!-- Fonts References -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&family=Lora:ital@1&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/static/style.css?v=20">
</head>
<body class="void-canvas">

  <!-- Navigation Bar-->
  <nav class="frosted-nav">
    <div class="brand">pwd.<span class="brand-italic">security</span></div>
    <div class="nav-links">
      <a href="#" class="nav-item">Helena </a>
      <a href="#" class="nav-item">BCA Minor Project</a>
    </div>
  </nav>

  <main class="page-layout">
    <!-- Hero Section -->
    <div class="hero-section">
      <h1 class="display-heading">
        Your new <br>
        <span class="display-italic">security baseline</span>
      </h1>
      <p class="body-subhead">Enter your password below to check its strength against brute-force and dictionary attacks.</p>
    </div>

    <div class="translucent-panel">
      <p class="section-stamp">A N A L Y S I S</p>
      
      <div class="input-row">
        <input type="text" id="pwdInput" placeholder="Type a password..." autocomplete="new-password" spellcheck="false">
        <button type="button" id="togglePassword" class="ghost-button">SHOW</button>
      </div>

      <div class="meter-track">
        <div id="progress-bar" class="meter-fill"></div>
      </div>
      <span id="percent" style="display:none;">0%</span>
      
      <div class="feedback-block">
        <p id="result" class="section-stamp result-stamp">WAITING</p>
        <p id="feedback-text" class="body-text text-steel">Tips will appear here...</p>
        <p id="crack-time" class="body-text text-signal"></p>
      </div>
    </div>

  </main>

  <!-- Coordinate Footer -->
  <footer class="coordinate-footer">
    <div class="footer-left">
      <span class="plus-icon">+</span>
      <span>Amrita Vishwa Vidyapeetham</span>
      <span>Minor Project</span>
    </div>
    <div class="footer-right">
      <span>9.9312° N, 76.2673° E</span>
      <span class="heart-icon">♥</span>
    </div>
  </footer>

  <script src="/static/script.js?v=6"></script>
</body>
</html>
