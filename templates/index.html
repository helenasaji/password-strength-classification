
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0914">

  <title>Vesper — Design System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <main class="canvas" id="canvas">

    <!-- Top navigation -->
    <header class="topbar">

      <div class="brand">
        <span class="brand-dot"></span>
        <span>VESPER</span>
        <span class="topbar-separator">·</span>
        <span class="brand-label">DESIGN SYSTEM</span>
      </div>

      <div class="version-label">
        <span>DARK</span>
        <span>·</span>
        <span>V1.0</span>
      </div>

    </header>

    <!-- Main hero -->
    <section class="hero">

      <h1 class="hero-title">Vesper</h1>

      <p class="hero-description">
        A calm, <strong>deep-dark</strong> interface system —
        darkness as a material, lit<br class="desktop-break">
        from beneath by a soft iris-violet aurora.
      </p>

    </section>

    <!-- Bottom controls -->
    <footer class="bottom-bar">

      <div class="palette" aria-label="Choose an accent color">

        <button
          class="swatch swatch-1"
          data-color="#0b0914"
          aria-label="Midnight"
          title="Midnight"
        ></button>

        <button
          class="swatch swatch-2"
          data-color="#171421"
          aria-label="Charcoal"
          title="Charcoal"
        ></button>

        <button
          class="swatch swatch-3"
          data-color="#282238"
          aria-label="Dark violet"
          title="Dark violet"
        ></button>

        <button
          class="swatch swatch-4 active"
          data-color="#7047ff"
          aria-label="Iris violet"
          title="Iris violet"
        ></button>

        <button
          class="swatch swatch-5"
          data-color="#b6a2ff"
          aria-label="Lavender"
          title="Lavender"
        ></button>

        <button
          class="swatch swatch-6"
          data-color="#f4f1ff"
          aria-label="Soft white"
          title="Soft white"
        ></button>

      </div>

      <button
        class="type-specimen"
        id="fontToggle"
        type="button"
        aria-label="Change typography specimen"
        title="Change typography specimen"
      >
        <span class="type-aa">Aa</span>
        <span class="type-label" id="fontLabel">GEIST</span>
      </button>

    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
