<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Classification</title>
  <meta name="description" content="Evaluate password entropy against brute-force and dictionary attacks.">
  <meta name="theme-color" content="#890149">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=14">
</head>
<body>
  <header class="hero-splash">
    <div class="hero-content">
      <h1 class="hero-title">Protect<br><span class="hero-highlight">Your Data</span></h1>
      <p class="hero-subtitle">Evaluate password entropy against brute-force and dictionary attacks.</p>
      <button id="scroll-btn" class="hero-btn">Try the Classifier</button>
    </div>
  </header>
  
  <main id="classifier-section" class="main-content">
    <section class="classifier-card">
      <div class="welcome-panel">
        <svg viewBox="0 0 900 600" class="blob-shield-svg" aria-hidden="true">
          <g transform="translate(458 297)">
            <path d="M124.4 -213.9C155.4 -197.5 170.8 -152.5 178.7 -112.1C186.6 -71.7 187.1 -35.8 198.6 6.7C210.2 49.2 232.8 98.3 223.3 136C213.8 173.7 172.2 199.9 129.6 214.3C87 228.7 43.5 231.3 5.8 221.4C-32 211.4 -64 188.9 -107.3 174.9C-150.6 160.9 -205.2 155.4 -227.9 127.7C-250.5 100 -241.3 50 -227.8 7.8C-214.4 -34.5 -196.8 -69 -176.7 -101C-156.5 -133.1 -133.8 -162.7 -103.9 -179.8C-74 -196.8 -37 -201.4 4.8 -209.8C46.7 -218.2 93.3 -230.3 124.4 -213.9" fill="#F3F3E7"></path>
          </g>
        </svg>
        <img src="/static/images/cherry-lock.webp" alt="Protected 3D Shield" class="shield-foreground-img">
      </div>

      <div class="form-panel">
        <h1>Password <span class="purple">Strength Checker</span></h1>
        <p class="intro">Check your Password Strength.</p>
        
        <label for="pwdInput">Password</label>
        
        <div class="password-field">
          <span class="input-lock" aria-hidden="true"><img src="/static/images/white-lock.webp" alt="" width="24" height="24"></span>
          <input type="text" id="pwdInput" placeholder="Enter your password..." autocomplete="new-password" spellcheck="false" aria-label="Type a password">
          <button type="button" id="togglePassword" class="eye-button" aria-label="Toggle password">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/>
              <circle cx="12" cy="12" r="2.8"/>
            </svg>
          </button>
        </div>
        <div class="strength-row">
          <div class="progress-container" role="progressbar" aria-label="Strength" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progress-bar" class="progress-fill"></div>
          </div>
          <span id="percent">0%</span>
        </div>

        <div class="tips-panel" aria-live="polite">
          <span class="bulb-icon" aria-hidden="true"><img src="/static/images/white-bulb.webp" alt="" width="30" height="34"></span>
          <div class="tips-content">
            <p id="result">Tips</p>
            <p id="feedback-text"></p>
            <p id="crack-time" class="crack-time"></p>
          </div>
        </div>

      </div>
    </section>
  </main>
  <script src="/static/script.js" defer></script>
</body>
</html>
